<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Beauty Evaluator 🧠✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0813;
            --card-bg: rgba(18, 14, 33, 0.7);
            --border-glow: rgba(0, 242, 254, 0.25);
            --neon-cyan: #00f2fe;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --text-main: #f3f0ff;
            --text-muted: #8b85a6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 0, 127, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.08) 0%, transparent 40%);
        }

        /* Ambient floating light blobs */
        .ambient-blob {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
            animation: drift 20s infinite alternate ease-in-out;
        }

        .blob-pink {
            background: var(--neon-pink);
            top: 20%;
            left: 15%;
            animation-delay: -5s;
        }

        .blob-cyan {
            background: var(--neon-cyan);
            bottom: 20%;
            right: 15%;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, -40px) scale(1.2); }
            100% { transform: translate(-40px, 60px) scale(0.9); }
        }

        /* Scanline Overlay Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 480px;
            z-index: 10;
            perspective: 1000px;
        }

        /* Glassmorphism Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-glow);
            border-radius: 28px;
            padding: 2.5rem 2rem;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(0, 242, 254, 0.05);
            text-align: center;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.03) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            transition: 0.75s;
            pointer-events: none;
        }

        .card:hover::after {
            left: 125%;
        }

        /* Titles and Texts */
        .header {
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* Scanner Display Area */
        .scanner-frame {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 2rem;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 242, 254, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
        }

        /* Scanning elements */
        .scanner-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, transparent, var(--neon-cyan), transparent);
            box-shadow: 0 0 12px var(--neon-cyan);
            animation: scan 3s infinite ease-in-out;
            z-index: 5;
            display: none; /* Only when scanning */
        }

        .scanning .scanner-frame::before {
            display: block;
        }

        @keyframes scan {
            0%, 100% { top: 0%; }
            50% { top: 98%; }
        }

        /* Camera/Face Silhouette */
        .silhouette {
            width: 120px;
            height: 120px;
            opacity: 0.25;
            transition: all 0.5s ease;
            color: var(--neon-cyan);
            filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.3));
        }

        .scanning .silhouette {
            animation: pulse-silhouette 1.5s infinite alternate ease-in-out;
            opacity: 0.65;
            color: var(--neon-pink);
            filter: drop-shadow(0 0 12px rgba(255, 0, 127, 0.5));
        }

        @keyframes pulse-silhouette {
            from { transform: scale(0.95); opacity: 0.4; }
            to { transform: scale(1.05); opacity: 0.8; }
        }

        /* Radar Circle Animation */
        .radar-circle {
            position: absolute;
            width: 170px;
            height: 170px;
            border: 2px dashed rgba(0, 242, 254, 0.15);
            border-radius: 50%;
            animation: rotateRadar 20s infinite linear;
            display: none;
        }

        .scanning .radar-circle {
            display: block;
            border-color: rgba(255, 0, 127, 0.25);
        }

        @keyframes rotateRadar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Result Image Styles */
        .result-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            display: none;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 4;
        }

        .revealed .result-image {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .revealed .silhouette, .revealed .radar-circle {
            display: none !important;
        }

        .revealed .scanner-frame {
            border-color: var(--neon-pink);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
            animation: popBorder 0.4s ease-out;
        }

        @keyframes popBorder {
            0% { transform: scale(1); border-color: var(--neon-cyan); }
            50% { transform: scale(1.08); border-color: #fff; }
            100% { transform: scale(1); border-color: var(--neon-pink); }
        }

        /* Console/Logs Area */
        .console-box {
            font-family: 'Share Tech Mono', monospace;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
            text-align: left;
            font-size: 0.8rem;
            height: 100px;
            overflow-y: hidden;
            margin-bottom: 2rem;
            display: none;
            color: var(--neon-green);
            text-shadow: 0 0 4px rgba(57, 255, 20, 0.2);
        }

        .console-line {
            margin-bottom: 0.4rem;
            opacity: 0;
            transform: translateY(5px);
            animation: fadeInUp 0.3s forwards ease;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin-bottom: 2rem;
            overflow: hidden;
            display: none;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        /* Interactive Buttons */
        .btn {
            background: transparent;
            color: #fff;
            border: 2px solid var(--neon-cyan);
            padding: 1rem 2.2rem;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: var(--neon-cyan);
            color: #0b0813;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.45);
            transform: translateY(-3px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-pink {
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.15);
        }

        .btn-pink:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.45);
        }

        /* Screen Shake Animation */
        .shake-card {
            animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        /* Face scanning mesh vector style */
        .face-mesh {
            width: 80px;
            height: 80px;
            stroke-width: 1.5;
            stroke: currentColor;
            fill: none;
        }

        /* Spark particles */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: 1.5rem;
        }

        /* Privacy Disclaimer */
        .disclaimer {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>
    <div class="ambient-blob blob-pink"></div>
    <div class="ambient-blob blob-cyan"></div>

    <div class="container">
        <div class="card" id="prankCard">
            <!-- Screen Header -->
            <div class="header">
                <h1 id="appTitle">Царай Шинжлэгч AI 🧠</h1>
                <p id="appDescription">AI технологид тулгуурлан таны царайны харьцаа болон гоо үзэсгэлэнг 99.8% нарийвчлалтайгаар тодорхойлно.</p>
            </div>

            <!-- Interactive Area / Scanner Frame -->
            <div class="scanner-frame" id="scannerFrame">
                <div class="radar-circle"></div>
                <!-- SVG Face Silhouette for Tech feel -->
                <svg class="silhouette" id="scannerSilhouette" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path class="face-mesh" d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 22 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 10.42 4.45 8.95 5.23 7.7L16.3 18.77C15.05 19.55 13.58 20 12 20ZM18.77 16.3L7.7 5.23C8.95 4.45 10.42 4 12 4C16.41 4 20 7.59 20 12C20 13.58 19.55 15.05 18.77 16.3Z" fill="currentColor"/>
                    <path d="M12 6C9.79 6 8 7.79 8 10C8 12.21 9.79 14 12 14C14.21 14 16 12.21 16 10C16 7.79 14.21 6 12 6Z" fill="currentColor"/>
                    <path d="M12 16C9.33 16 4 17.33 4 20V21H20V20C20 17.33 14.67 16 12 16Z" fill="currentColor"/>
                </svg>
                <!-- Prank Image -->
                <img src="images/monkeymidlefinger.png" alt="Monkey Prank" class="result-image" id="prankImage">
            </div>

            <!-- Console Log Output (hidden until scan starts) -->
            <div class="console-box" id="consoleBox"></div>

            <!-- Progress Bar (hidden until scan starts) -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <!-- Main Button Action -->
            <button class="btn" id="actionBtn">Шинжилгээг эхлүүлэх 📸</button>

            <!-- Small Privacy Notice -->
            <p class="disclaimer" id="disclaimerText">Бид таны камерны зураг болон хувийн мэдээллийг серверт хадгалахгүй.</p>
        </div>
    </div>

    <script>
        const card = document.getElementById('prankCard');
        const appTitle = document.getElementById('appTitle');
        const appDescription = document.getElementById('appDescription');
        const actionBtn = document.getElementById('actionBtn');
        const scannerFrame = document.getElementById('scannerFrame');
        const consoleBox = document.getElementById('consoleBox');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const disclaimerText = document.getElementById('disclaimerText');
        const prankImage = document.getElementById('prankImage');

        let appState = 'welcome'; // welcome, scanning, completed, revealed
        let audioCtx = null;

        // Custom Sound Generator using Web Audio API (No files needed)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSciFiBeep(pitch, duration, type='sine') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = type;
            osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playRevealSound() {
            if (!audioCtx) return;
            
            // Dramatic fail/prank retro synth sound effect
            const now = audioCtx.currentTime;
            
            // Sound Part 1: Ascending tech noise
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(150, now);
            osc1.frequency.exponentialRampToValueAtTime(1200, now + 0.5);
            gain1.gain.setValueAtTime(0.2, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc1.start(now);
            osc1.stop(now + 0.5);

            // Sound Part 2: Comical drop / alarm
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(800, now + 0.45);
            osc2.frequency.linearRampToValueAtTime(80, now + 1.2);
            gain2.gain.setValueAtTime(0.25, now + 0.45);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.25);
            osc2.start(now + 0.45);
            osc2.stop(now + 1.3);

            // Sound Part 3: Low bass impact
            const osc3 = audioCtx.createOscillator();
            const gain3 = audioCtx.createGain();
            osc3.connect(gain3);
            gain3.connect(audioCtx.destination);
            osc3.type = 'triangle';
            osc3.frequency.setValueAtTime(120, now + 0.48);
            osc3.frequency.linearRampToValueAtTime(50, now + 1.0);
            gain3.gain.setValueAtTime(0.4, now + 0.48);
            gain3.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
            osc3.start(now + 0.48);
            osc3.stop(now + 1.1);
        }

        // Fake console log messages during scanning
        const scanLogs = [
            { time: 0, text: "❯ Төхөөрөмжийн биометр холболтыг шалгаж байна..." },
            { time: 800, text: "❯ Камерын линзийг автоматаар тохирууллаа." },
            { time: 1600, text: "❯ Хүрээлэн буй орчны гэрэлтүүлгийг оновчтой болгов." },
            { time: 2400, text: "❯ Нүүрний 68 биометрик цэгүүдийг илрүүлж байна..." },
            { time: 3200, text: "❯ Шинжилж байна: Арьсны бүтэц, хөгшрөлтийн индекс." },
            { time: 4000, text: "❯ Тооцоолж байна: Симметри болон харьцааны дүн." },
            { time: 4800, text: "❯ Гоо сайхны үнэлгээний алгоритм ажиллаж байна..." },
            { time: 5400, text: "❯ АМЖИЛТТАЙ: Дүн шинжилгээ нэгтгэгдэж дууслаа." }
        ];

        function addLogLine(text) {
            const line = document.createElement('div');
            line.className = 'console-line';
            line.innerText = text;
            consoleBox.appendChild(line);
            consoleBox.scrollTop = consoleBox.scrollHeight;
            playSciFiBeep(600, 0.05, 'sine');
        }

        function startScanning() {
            initAudio();
            appState = 'scanning';
            
            // Switch layout state to scanning
            card.classList.add('scanning');
            consoleBox.style.display = 'block';
            progressContainer.style.display = 'block';
            disclaimerText.style.display = 'none';
            
            actionBtn.disabled = true;
            actionBtn.innerText = "Шинжилж байна...";
            actionBtn.style.opacity = '0.7';
            actionBtn.style.cursor = 'not-allowed';

            consoleBox.innerHTML = '';
            
            // Trigger fake logs
            scanLogs.forEach(log => {
                setTimeout(() => {
                    if (appState === 'scanning') {
                        addLogLine(log.text);
                    }
                }, log.time);
            });

            // Animate progress bar
            let progress = 0;
            const progressInterval = setInterval(() => {
                if (progress >= 100) {
                    clearInterval(progressInterval);
                    completeScanning();
                } else {
                    progress += 1;
                    progressBar.style.width = progress + '%';
                    if (progress % 12 === 0) {
                        playSciFiBeep(450, 0.03, 'triangle');
                    }
                }
            }, 60); // Total around 6 seconds
        }

        function completeScanning() {
            appState = 'completed';
            actionBtn.disabled = false;
            actionBtn.innerText = "Үр дүнг харах 📊";
            actionBtn.style.opacity = '1';
            actionBtn.style.cursor = 'pointer';
            actionBtn.classList.add('btn-pink');
            
            // Visual alert
            playSciFiBeep(880, 0.25, 'sine');
            setTimeout(() => playSciFiBeep(1100, 0.3, 'sine'), 120);
        }

        function revealPrank() {
            appState = 'revealed';
            
            // Sound effect
            playRevealSound();

            // Add shake class
            card.classList.add('shake-card');
            setTimeout(() => {
                card.classList.remove('shake-card');
            }, 600);

            // Change page state to revealed
            card.classList.remove('scanning');
            card.classList.add('revealed');
            
            // Hide scanner tools
            consoleBox.style.display = 'none';
            progressContainer.style.display = 'none';

            // Change titles and texts
            appTitle.innerText = "ҮР ДҮН: 100% ШИМПАНЗЕ! 🐒🖕";
            appTitle.style.background = 'linear-gradient(45deg, #ff007f, #ffaa00)';
            appTitle.style.webkitBackgroundClip = 'text';
            
            appDescription.innerText = "Манай AI технологи таныг дэлхийн хамгийн ховор тохиох ойн сармагчинтай 99.9% ижил царайны бүтэцтэй болохыг тогтоолоо. Баяр хүргэе!";
            appDescription.style.color = '#ff4b8b';

            // Change button to Reset
            actionBtn.innerText = "Дахин уншуулах 🔄";
            actionBtn.classList.remove('btn-pink');
            actionBtn.style.borderColor = 'var(--neon-cyan)';
            actionBtn.style.boxShadow = '0 0 15px rgba(0, 242, 254, 0.15)';
            
            // Spark particle burst
            const rect = actionBtn.getBoundingClientRect();
            const centerX = window.innerWidth / 2;
            const centerY = rect.top + rect.height / 2;
            for (let i = 0; i < 30; i++) {
                createSparkParticle(centerX, centerY);
            }
        }

        function resetApp() {
            appState = 'welcome';
            
            // Reset visual states
            card.classList.remove('revealed');
            card.classList.remove('scanning');
            
            appTitle.innerText = "Царай Шинжлэгч AI 🧠";
            appTitle.style.background = 'linear-gradient(45deg, var(--neon-cyan), var(--neon-pink))';
            appTitle.style.webkitBackgroundClip = 'text';
            
            appDescription.innerText = "AI технологид тулгуурлан таны царайны харьцаа болон гоо үзэсгэлэнг 99.8% нарийвчлалтайгаар тодорхойлно.";
            appDescription.style.color = 'var(--text-muted)';
            
            progressBar.style.width = '0%';
            actionBtn.innerText = "Шинжилгээг эхлүүлэх 📸";
            actionBtn.classList.remove('btn-pink');
            
            disclaimerText.style.display = 'block';
            
            playSciFiBeep(350, 0.1, 'sine');
        }

        // Particle generator
        function createSparkParticle(x, y) {
            const p = document.createElement('div');
            p.className = 'particle';
            const particles = ['🐒', '🍌', '💥', '👀', '💢', '🖕'];
            p.innerText = particles[Math.floor(Math.random() * particles.length)];
            document.body.appendChild(p);

            const destX = x + (Math.random() - 0.5) * 500;
            const destY = y + (Math.random() - 0.5) * 500;

            p.animate([
                { 
                    transform: 'translate(-50%, -50%) translate(0, 0) scale(0) rotate(0deg)',
                    opacity: 1,
                    left: x + 'px',
                    top: y + 'px'
                },
                { 
                    transform: `translate(-50%, -50%) translate(${destX - x}px, ${destY - y}px) scale(2) rotate(${Math.random() * 360}deg)`,
                    opacity: 0,
                    left: x + 'px',
                    top: y + 'px'
                }
            ], {
                duration: 800 + Math.random() * 600,
                easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)'
            }).onfinish = () => p.remove();
        }

        // Handle Main Button click based on current state
        actionBtn.addEventListener('click', () => {
            if (appState === 'welcome') {
                startScanning();
            } else if (appState === 'completed') {
                revealPrank();
            } else if (appState === 'revealed') {
                resetApp();
            }
        });
    </script>
</body>
</html>
