<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сүнсний Хань Тодорхойлогч ✨</title>

    <!-- Open Graph / Facebook Link Preview Metadata -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Сүнсний Хань Тодорхойлогч ✨">
    <meta property="og:description"
        content="Төрсөн он сар, нас, хүйсийн мэдээллээ оруулж одон орны болон энергийн зохицлоор сүнсний ханиа тодорхойлно уу.">
    <meta property="og:image" content="images/preview.png">

    <!-- Twitter Link Preview Metadata -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Сүнсний Хань Тодорхойлогч ✨">
    <meta property="twitter:description"
        content="Төрсөн он сар, нас, хүйсийн мэдээллээ оруулж одон орны болон энергийн зохицлоор сүнсний ханиа тодорхойлно уу.">
    <meta property="twitter:image" content="images/preview.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAF6F0;
            /* Warm organic cream */
            --card-bg: #FFFFFF;
            --accent-color: #C49A6C;
            /* Antique soft gold */
            --accent-hover: #B28859;
            --text-main: #2E2C2A;
            /* Deep charcoal */
            --text-muted: #7A7571;
            /* Soft warm grey */
            --card-shadow: 0 15px 45px rgba(46, 44, 42, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle glowing warm backgrounds */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(196, 154, 108, 0.06) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .glow-1 {
            top: 15%;
            left: 10%;
        }

        .glow-2 {
            bottom: 15%;
            right: 10%;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 420px;
            z-index: 10;
        }

        /* Minimalist Card */
        .card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 3rem 2.2rem;
            box-shadow: var(--card-shadow);
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(196, 154, 108, 0.1);
        }

        .card-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Typography styling */
        .header {
            margin-bottom: 2rem;
            transition: opacity 0.3s ease;
        }

        .header h1 {
            font-family: 'Nunito', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.75rem;
            letter-spacing: -0.2px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Minimalist Input Form */
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 1rem;
        }

        .form-group {
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(196, 154, 108, 0.25);
            background: #FFFFFF;
            color: var(--text-main);
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(196, 154, 108, 0.1);
        }

        /* Spinner for Simulation */
        .loader-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 2rem 0;
        }

        .loader-circle {
            width: 60px;
            height: 60px;
            border: 2px solid rgba(196, 154, 108, 0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Status text during loading */
        .status-text {
            font-size: 0.9rem;
            font-style: italic;
            color: var(--text-muted);
            min-height: 1.5rem;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        /* Progress Bar */
        .progress-container {
            width: 100px;
            height: 2px;
            background: rgba(196, 154, 108, 0.15);
            border-radius: 1px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            transition: width 0.1s linear;
        }

        .result-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 28px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 1.5s ease, visibility 1.5s ease;
            z-index: 10;
        }

        .revealed .result-image {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Action Buttons */
        .btn-wrapper {
            width: 100%;
            z-index: 20;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
        }

        .btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0.9rem 2.2rem;
            font-size: 0.98rem;
            font-weight: 500;
            border-radius: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            width: 100%;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(196, 154, 108, 0.18);
        }

        .btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 18px rgba(196, 154, 108, 0.28);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Hide action button when the prank is revealed */
        .revealed .btn-wrapper {
            display: none;
        }

        /* Screen Shake Animation */
        .shake-card {
            animation: shake 0.6s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-2px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(4px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-8px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(8px, 0, 0);
            }
        }

        /* Particle element */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: 1.5rem;
        }

        /* Privacy Disclaimer */
        .disclaimer {
            margin-top: 1.2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.6;
            letter-spacing: 0.2px;
            transition: opacity 0.3s ease;
        }

        /* Form alert helper */
        .error-message {
            color: #d9534f;
            font-size: 0.8rem;
            margin-top: 0.3rem;
            display: none;
            text-align: left;
        }
    </style>
</head>

<body class="welcome">
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="container">
        <div class="card" id="prankCard">
            <!-- Full-Screen Prank Image (Loaded dynamically to avoid spoiler in link previews) -->
            <img src="" alt="Soul mate" class="result-image" id="prankImage">

            <div class="card-content" id="cardContent">
                <!-- Screen Header -->
                <div class="header" id="cardHeader">
                    <h1>Soul mate Тодорхойлогч ✨</h1>
                    <p>Төрсөн он сар, нас, хүйсийн мэдээллээ оруулж одон орны болон энергийн зохицлоор сүнсний ханиа
                        тодорхойлно уу.</p>
                </div>

                <!-- Demographic Input Form -->
                <div class="form-container" id="formContainer">
                    <div class="form-group">
                        <label for="birthDate">Төрсөн он, сар, өдөр</label>
                        <input type="date" class="form-input" id="birthDate" required>
                    </div>

                    <div class="form-group">
                        <label for="age">Нас</label>
                        <input type="number" min="1" max="120" class="form-input" id="age" required
                            placeholder="Жишээ нь: 22">
                    </div>

                    <div class="form-group">
                        <label for="gender">Хүйс</label>
                        <select class="form-input" id="gender" required>
                            <option value="" disabled selected>Хүйсээ сонгоно уу</option>
                            <option value="male">Эрэгтэй</option>
                            <option value="female">Эмэгтэй</option>
                        </select>
                    </div>
                    <div class="error-message" id="formError">⚠️ Бүх талбарыг зөв бөглөнө үү.</div>
                </div>

                <!-- Simulation Loading State -->
                <div class="loader-container" id="loaderContainer">
                    <div class="loader-circle"></div>
                    <div class="status-text" id="statusText"></div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>
            </div>

            <!-- Button Wrapper -->
            <div class="btn-wrapper">
                <button class="btn" id="actionBtn">Тодорхойлох 🔮</button>
            </div>

            <!-- Small Privacy Notice -->
            <p class="disclaimer" id="disclaimerText">Бид таны мэдээллийг хадгалахгүй бөгөөд зөвхөн төхөөрөмж дээр
                боловсруулна.</p>
        </div>
    </div>

    <script>
        const card = document.getElementById('prankCard');
        const cardContent = document.getElementById('cardContent');
        const cardHeader = document.getElementById('cardHeader');
        const formContainer = document.getElementById('formContainer');
        const loaderContainer = document.getElementById('loaderContainer');
        const actionBtn = document.getElementById('actionBtn');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const disclaimerText = document.getElementById('disclaimerText');
        const prankImage = document.getElementById('prankImage');
        const formError = document.getElementById('formError');

        // Inputs
        const birthDateInput = document.getElementById('birthDate');
        const ageInput = document.getElementById('age');
        const genderInput = document.getElementById('gender');

        let appState = 'welcome'; // welcome, calculating, completed, revealed
        let audioCtx = null;

        // Custom Sound Generator using Web Audio API
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSoftNote(pitch, duration, type = 'sine', volume = 0.08) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = type;
            osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);

            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Ascending magic arpeggio + funny bass drop at the end
        function playPrankSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            // 1. Ascending magical bell chime
            const notes = [1046.50, 1318.51, 1567.98, 2093.00, 2637.02]; // C6, E6, G6, C7, E7
            notes.forEach((freq, index) => {
                const time = now + index * 0.08;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, time);

                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.12, time + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.35);

                osc.start(time);
                osc.stop(time + 0.4);
            });

            // 2. High-speed comic drop / trombone sound immediately following the chime
            const dropTime = now + 0.42;
            const oscDrop = audioCtx.createOscillator();
            const gainDrop = audioCtx.createGain();
            oscDrop.connect(gainDrop);
            gainDrop.connect(audioCtx.destination);

            oscDrop.type = 'triangle';
            oscDrop.frequency.setValueAtTime(750, dropTime);
            oscDrop.frequency.linearRampToValueAtTime(70, dropTime + 0.8);

            gainDrop.gain.setValueAtTime(0.25, dropTime);
            gainDrop.gain.exponentialRampToValueAtTime(0.001, dropTime + 0.8);

            oscDrop.start(dropTime);
            oscDrop.stop(dropTime + 0.85);

            // 3. Low sub-bass hit for vibration impact
            const oscBass = audioCtx.createOscillator();
            const gainBass = audioCtx.createGain();
            oscBass.connect(gainBass);
            gainBass.connect(audioCtx.destination);

            oscBass.type = 'sine';
            oscBass.frequency.setValueAtTime(100, dropTime + 0.05);
            oscBass.frequency.linearRampToValueAtTime(45, dropTime + 0.6);

            gainBass.gain.setValueAtTime(0.4, dropTime + 0.05);
            gainBass.gain.exponentialRampToValueAtTime(0.001, dropTime + 0.65);

            oscBass.start(dropTime + 0.05);
            oscBass.stop(dropTime + 0.7);
        }

        // Calculation phrases
        const calcPhrases = [
            { time: 0, text: "Одон орны байрлалыг тооцоолж байна..." },
            { time: 1200, text: "Төрсөн өдрийн энергийн долгионыг шинжилж байна..." },
            { time: 2400, text: "Сүнсний давтамжийн ухамсрыг уншиж байна..." },
            { time: 3600, text: "Тохирох аура хайлтыг дуусгаж байна..." },
            { time: 4500, text: "Тооцоолол амжилттай дууслаа." }
        ];

        function validateForm() {
            if (!birthDateInput.value || !ageInput.value || ageInput.value <= 0 || !genderInput.value) {
                formError.style.display = 'block';
                return false;
            }
            formError.style.display = 'none';
            return true;
        }

        function startCalculations() {
            if (!validateForm()) return;

            initAudio();
            appState = 'calculating';

            formContainer.style.display = 'none';
            loaderContainer.style.display = 'flex';
            disclaimerText.style.opacity = '0';

            actionBtn.disabled = true;
            actionBtn.innerText = "Тооцоолж байна...";
            actionBtn.style.opacity = '0.6';
            actionBtn.style.cursor = 'not-allowed';

            // Loop through statuses
            calcPhrases.forEach(phrase => {
                setTimeout(() => {
                    if (appState === 'calculating') {
                        statusText.innerText = phrase.text;
                        playSoftNote(523.25, 0.08); // Soft piano key on status change
                    }
                }, phrase.time);
            });

            // Animate minimalist progress bar
            let progress = 0;
            const progressInterval = setInterval(() => {
                if (progress >= 100) {
                    clearInterval(progressInterval);
                    completeCalculations();
                } else {
                    progress += 1;
                    progressBar.style.width = progress + '%';
                }
            }, 50); // Around 5 seconds
        }

        function completeCalculations() {
            appState = 'completed';
            actionBtn.disabled = false;
            actionBtn.innerText = "Үр дүнг харах 🤍";
            actionBtn.style.opacity = '1';
            actionBtn.style.cursor = 'pointer';

            // Soft chime notification
            playSoftNote(880, 0.15); // A5
            setTimeout(() => playSoftNote(1046.50, 0.2), 80); // C6
        }

        function revealPrank() {
            appState = 'revealed';

            // Set the prank image source dynamically to avoid spoiling the prank in link previews
            prankImage.src = 'images/monkeymidlefinger.png';

            // Change page state to revealed
            card.classList.add('revealed');

            // Hide all layout contents
            cardContent.style.display = 'none';
            disclaimerText.style.display = 'none';

            // Change action button text to Reset

        }

        function resetApp() {
            appState = 'welcome';

            // Clear the prank image source to keep it hidden
            prankImage.removeAttribute('src');

            // Reset fields
            birthDateInput.value = '';
            ageInput.value = '';
            genderInput.value = '';

            // Reset layout states
            card.classList.remove('revealed');

            cardContent.style.display = 'flex';
            formContainer.style.display = 'flex';
            loaderContainer.style.display = 'none';
            disclaimerText.style.display = 'block';
            disclaimerText.style.opacity = '0.6';

            progressBar.style.width = '0%';
            statusText.innerText = "";

            actionBtn.innerText = "Тодорхойлох 🔮";
            actionBtn.style.opacity = '1';
            actionBtn.disabled = false;
            actionBtn.style.cursor = 'pointer';

            playSoftNote(392.00, 0.1); // G4
        }

        // Particle generator
        function createSparkParticle(x, y) {
            const p = document.createElement('div');
            p.className = 'particle';
            const particles = ['🐒', '💥', '👀', '🖕', '🍌'];
            p.innerText = particles[Math.floor(Math.random() * particles.length)];
            document.body.appendChild(p);

            const destX = x + (Math.random() - 0.5) * 450;
            const destY = y + (Math.random() - 0.5) * 450;

            p.animate([
                {
                    transform: 'translate(-50%, -50%) translate(0, 0) scale(0) rotate(0deg)',
                    opacity: 1,
                    left: x + 'px',
                    top: y + 'px'
                },
                {
                    transform: `translate(-50%, -50%) translate(${destX - x}px, ${destY - y}px) scale(2) rotate(${Math.random() * 360}deg)`,
                    opacity: 0,
                    left: x + 'px',
                    top: y + 'px'
                }
            ], {
                duration: 700 + Math.random() * 500,
                easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)'
            }).onfinish = () => p.remove();
        }

        // Handle button clicks
        actionBtn.addEventListener('click', () => {
            if (appState === 'welcome') {
                startCalculations();
            } else if (appState === 'completed') {
                revealPrank();
            } else if (appState === 'revealed') {
                resetApp();
            }
        });
    </script>
</body>

</html>
