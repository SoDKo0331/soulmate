<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сүнсний Хань Тодорхойлогч ✨</title>

    <!-- Open Graph / Facebook Link Preview Metadata -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Сүнсний Хань Тодорхойлогч ✨">
    <meta property="og:description"
        content="Төрсөн он сар, нас, хүйсийн мэдээллээ оруулж одон орны болон энергийн зохицлоор сүнсний ханиа тодорхойлно уу.">
    <meta property="og:image" content="images/preview.png">

    <!-- Twitter Link Preview Metadata -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Сүнсний Хань Тодорхойлогч ✨">
    <meta property="twitter:description"
        content="Төрсөн он сар, нас, хүйсийн мэдээллээ оруулж одон орны болон энергийн зохицлоор сүнсний ханиа тодорхойлно уу.">
    <meta property="twitter:image" content="images/preview.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAF6F0;
            /* Warm organic cream */
            --card-bg: #FFFFFF;
            --accent-color: #C49A6C;
            /* Antique soft gold */
            --accent-hover: #B28859;
            --text-main: #2E2C2A;
            /* Deep charcoal */
            --text-muted: #7A7571;
            /* Soft warm grey */
            --card-shadow: 0 15px 45px rgba(46, 44, 42, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle glowing warm backgrounds */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(196, 154, 108, 0.06) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .glow-1 {
            top: 15%;
            left: 10%;
        }

        .glow-2 {
            bottom: 15%;
            right: 10%;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 420px;
            z-index: 10;
        }

        /* Minimalist Card */
        .card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 3rem 2.2rem;
            box-shadow: var(--card-shadow);
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(196, 154, 108, 0.1);
        }

        .card-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Typography styling */
        .header {
            margin-bottom: 2rem;
            transition: opacity 0.3s ease;
        }

        .header h1 {
            font-family: 'Nunito', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.75rem;
            letter-spacing: -0.2px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Minimalist Input Form */
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 1rem;
        }

        .form-group {
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(196, 154, 108, 0.25);
            background: #FFFFFF;
            color: var(--text-main);
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(196, 154, 108, 0.1);
        }

        /* Spinner for Simulation */
        .loader-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 2rem 0;
        }

        .loader-circle {
            width: 60px;
            height: 60px;
            border: 2px solid rgba(196, 154, 108, 0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Status text during loading */
        .status-text {
            font-size: 0.9rem;
            font-style: italic;
            color: var(--text-main);
            min-height: 1.5rem;
            transition: all 0.3s ease;
            margin-bottom: 0.5rem;
        }

        .status-percent {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }

        /* Progress Bar */
        .progress-container {
            width: 150px;
            height: 4px;
            background: rgba(196, 154, 108, 0.15);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            transition: width 0.1s linear;
        }

        .result-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 28px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 1.5s ease, visibility 1.5s ease;
            z-index: 10;
        }

        .revealed .result-image {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .revealed .btn-wrapper {
            display: none;
        }

        /* Action Buttons */
        .btn-wrapper {
            width: 100%;
            z-index: 20;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
        }

        .btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0.9rem 2.2rem;
            font-size: 0.98rem;
            font-weight: 500;
            border-radius: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            width: 100%;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(196, 154, 108, 0.18);
        }

        .btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 18px rgba(196, 154, 108, 0.28);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Screen Shake Animation */
        .shake-card {
            animation: shake 0.6s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        /* Privacy Disclaimer */
        .disclaimer {
            margin-top: 1.2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.6;
            letter-spacing: 0.2px;
            transition: opacity 0.3s ease;
        }

        /* Form alert helper */
        .error-message {
            color: #d9534f;
            font-size: 0.8rem;
            margin-top: 0.3rem;
            display: none;
            text-align: left;
        }
    </style>
</head>

<body class="welcome">
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="container">
        <div class="card" id="prankCard">
            <!-- Prank Image inside card -->
            <img src="" alt="Soul mate" class="result-image" id="prankImage">

            <div class="card-content" id="cardContent">
                <!-- Screen Header -->
                <div class="header" id="cardHeader">
                    <h1>Soul mate Тодорхойлогч ✨</h1>
                    <p>Таны хувийн мэдээлэл болон одон орны зохицлоор сүнсний ханийг тань тодорхойлох болно.</p>
                </div>

                <!-- Demographic Input Form -->
                <div class="form-container" id="formContainer">
                    <div class="form-group">
                        <label for="userName">Таны нэр</label>
                        <input type="text" class="form-input" id="userName" required placeholder="Нэрээ оруулна уу">
                    </div>

                    <div class="form-group">
                        <label for="birthDate">Төрсөн он, сар, өдөр</label>
                        <input type="date" class="form-input" id="birthDate" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Хүйс</label>
                        <select class="form-input" id="gender" required>
                            <option value="" disabled selected>Хүйсээ сонгоно уу</option>
                            <option value="male">Эрэгтэй</option>
                            <option value="female">Эмэгтэй</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mbti">MBTI төрөл</label>
                        <select class="form-input" id="mbti" required>
                            <option value="" disabled selected>MBTI сонгох (мэдэхгүй бол таах)</option>
                            <option value="intj">INTJ - Архитектор</option>
                            <option value="intp">INTP - Сэтгэгч</option>
                            <option value="entj">ENTJ - Удирдагч</option>
                            <option value="entp">ENTP - Мэтгэлцэгч</option>
                            <option value="infj">INFJ - Өмгөөлөгч</option>
                            <option value="infp">INFP - Зуучлагч</option>
                            <option value="enfj">ENFJ - Гол дүр</option>
                            <option value="enfp">ENFP - Тэмцэгч</option>
                            <option value="istj">ISTJ - Логикч</option>
                            <option value="isfj">ISFJ - Хамгаалагч</option>
                            <option value="estj">ESTJ - Гүйцэтгэх захирал</option>
                            <option value="esfj">ESFJ - Консул</option>
                            <option value="istp">ISTP - Урлаач</option>
                            <option value="isfp">ISFP - Адал явдал эрэгч</option>
                            <option value="estp">ESTP - Бизнесмен</option>
                            <option value="esfp">ESFP - Цэнгээгч</option>
                        </select>
                    </div>
                    <div class="error-message" id="formError">⚠️ Бүх талбарыг зөв бөглөнө үү.</div>
                </div>

                <!-- Simulation Loading State -->
                <div class="loader-container" id="loaderContainer">
                    <div class="loader-circle"></div>
                    <div class="status-text" id="statusText">Холбогдож байна...</div>
                    <div class="status-percent" id="statusPercent">0%</div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>
            </div>

            <!-- Button Wrapper -->
            <div class="btn-wrapper" id="btnWrapper">
                <button class="btn" id="actionBtn">Тодорхойлох 🔮</button>
            </div>

            <!-- Small Privacy Notice -->
            <p class="disclaimer" id="disclaimerText">Бид таны мэдээллийг хадгалахгүй бөгөөд зөвхөн төхөөрөмж дээр
                боловсруулна.</p>
        </div>
    </div>

    <script>
        const card = document.getElementById('prankCard');
        const formContainer = document.getElementById('formContainer');
        const loaderContainer = document.getElementById('loaderContainer');
        const actionBtn = document.getElementById('actionBtn');
        const statusText = document.getElementById('statusText');
        const statusPercent = document.getElementById('statusPercent');
        const progressBar = document.getElementById('progressBar');
        const disclaimerText = document.getElementById('disclaimerText');
        const prankImage = document.getElementById('prankImage');
        const formError = document.getElementById('formError');
        const btnWrapper = document.getElementById('btnWrapper');

        // Inputs
        const userNameInput = document.getElementById('userName');
        const birthDateInput = document.getElementById('birthDate');
        const genderInput = document.getElementById('gender');
        const mbtiInput = document.getElementById('mbti');

        let appState = 'welcome'; 

        const stages = [
            { t: "Мэдээллийн сантай холбогдож байна...", p: 15 },
            { t: "Одон орны матрицыг үүсгэж байна...", p: 28 },
            { t: "Зан чанарын алгоритмыг ажиллуулж байна...", p: 42 },
            { t: "Дэлхийн 8 тэрбум хүн дунд хайлт хийж байна...", p: 56 },
            { t: "Тохирох кандидатуудыг шүүж байна...", p: 71 },
            { t: "Гадаад төрхийн нийцлийг тооцоолж байна...", p: 83 },
            { t: "Энергийн давтамжийг тааруулж байна...", p: 92 },
            { t: "Эцсийн нэг хүнийг баталгаажуулж байна...", p: 99 }
        ];

        function vibrate(pattern) {
            if (navigator.vibrate) {
                navigator.vibrate(pattern);
            }
        }

        function validateForm() {
            if (!userNameInput.value.trim() || !birthDateInput.value || !genderInput.value || !mbtiInput.value) {
                formError.style.display = 'block';
                card.classList.add('shake-card');
                vibrate(50);
                setTimeout(() => card.classList.remove('shake-card'), 600);
                return false;
            }
            formError.style.display = 'none';
            return true;
        }

        function check_sex() {
            if (genderInput.value === 'male') {
                prankImage.src = 'images/monkeymidlefinger.png';
            } else if (genderInput.value === 'female') {
                prankImage.src = 'images/banshitaitsai.png';
            }
        }

        async function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        async function startCalculations() {
            if (!validateForm()) return;

            check_sex();

            appState = 'calculating';

            formContainer.style.display = 'none';
            loaderContainer.style.display = 'flex';
            disclaimerText.style.opacity = '0';
            btnWrapper.style.display = 'none';

            let currentP = 0;
            
            for (let i = 0; i < stages.length; i++) {
                const stage = stages[i];
                statusText.innerText = stage.t;
                
                vibrate(30);

                while (currentP < stage.p) {
                    currentP += Math.random() * 2 + 1;
                    if(currentP > stage.p) currentP = stage.p;
                    
                    progressBar.style.width = currentP + '%';
                    statusPercent.innerText = Math.floor(currentP) + '%';
                    await sleep(40 + Math.random() * 50);
                }
                
                if(currentP === 99) {
                    statusPercent.style.color = '#d9534f';
                    await sleep(2500); // The 99% pause
                    statusPercent.style.color = 'var(--accent-color)';
                } else {
                    await sleep(500 + Math.random() * 700);
                }
            }

            // Finish
            progressBar.style.width = '100%';
            statusPercent.innerText = '100%';
            statusText.innerText = "Тооцоолол амжилттай дууслаа!";
            
            vibrate([100, 50, 100]);
            
            appState = 'completed';
            btnWrapper.style.display = 'block';
            actionBtn.innerText = "Үр дүнг харах 🤍";
        }

        function revealPrank() {
            appState = 'revealed';
            vibrate([200, 100, 300, 100, 400]);
            
            card.classList.add('revealed');
            
            document.getElementById('cardContent').style.display = 'none';
            document.getElementById('disclaimerText').style.display = 'none';
            document.getElementById('btnWrapper').style.display = 'none';
        }

        actionBtn.addEventListener('click', () => {
            if (appState === 'welcome') {
                startCalculations();
            } else if (appState === 'completed') {
                revealPrank();
            }
        });

    </script>
</body>

</html>
